[install]
# Use pnpm-style isolated installs so each workspace resolves only its own
# declared dependencies. The figma-plugin pins Vite 5 (via Vitest 2), while
# Blume owns the website's current Astro/Vite toolchain. Hoisting would force
# incompatible build dependencies into one resolution. Isolation keeps each
# app's toolchain self-contained.
linker = "isolated"
