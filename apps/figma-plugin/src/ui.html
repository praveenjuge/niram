<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Niram</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: var(--figma-color-bg, #ffffff);
        --bg-hover: var(--figma-color-bg-hover, rgba(0, 0, 0, 0.06));
        --bg-secondary: var(--figma-color-bg-secondary, #f5f5f5);
        --fg: var(--figma-color-text, #1e1e1e);
        --muted: var(--figma-color-text-secondary, #8c8c8c);
        --border: var(--figma-color-border, #e6e6e6);
        --border-strong: var(--figma-color-border-strong, #cdcdcd);
        --accent: var(--figma-color-bg-brand, #0d99ff);
        --accent-pressed: var(--figma-color-bg-brand-pressed, #0a6dc2);
        --accent-fg: var(--figma-color-text-onbrand, #ffffff);
        --danger-bg: var(--figma-color-bg-danger, #e03e3e);
        --danger-fg: var(--figma-color-text-ondanger, #ffffff);
        --danger: var(--figma-color-text-danger, #e03e3e);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-size: 11px;
        line-height: 16px;
        color: var(--fg);
        background: var(--bg);
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }
      main {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1;
      }
      header {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      h1 {
        margin: 0;
        font-size: 11px;
        font-weight: 600;
      }
      p.subtitle {
        margin: 0;
        color: var(--muted);
      }

      /* Input */
      input[type="text"] {
        width: 100%;
        height: 28px;
        padding: 0 8px;
        border: 1px solid transparent;
        border-radius: 5px;
        background: var(--bg-secondary);
        color: var(--fg);
        font: inherit;
        outline: none;
        transition: border-color 80ms ease;
      }
      input[type="text"]:hover {
        border-color: var(--border-strong);
      }
      input[type="text"]:focus {
        border-color: var(--accent);
        background: var(--bg);
      }
      input[type="text"]::placeholder {
        color: var(--muted);
      }

      /* Preset chips (shuffle is the trailing chip) */
      .presets-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .preset-badge {
        appearance: none;
        display: inline-flex;
        align-items: center;
        height: 24px;
        padding: 0 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--fg);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition:
          border-color 80ms ease,
          background 80ms ease;
      }
      .preset-badge:hover:not(:disabled) {
        border-color: var(--border-strong);
        background: var(--bg-hover);
      }
      .preset-badge:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .preset-badge.shuffle {
        border-style: dashed;
      }

      /* Footer / actions */
      footer {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .status {
        margin: 0;
        color: var(--muted);
        word-break: break-word;
      }
      .status.error {
        color: var(--danger);
      }
      .status.done {
        color: var(--fg);
      }
      .status[hidden] {
        display: none;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      button.btn {
        position: relative;
        overflow: hidden;
        appearance: none;
        height: 32px;
        padding: 0 14px;
        border-radius: 6px;
        border: 1px solid var(--border-strong);
        background: var(--bg);
        color: var(--fg);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        transition: background 80ms ease;
      }
      button.btn:hover:not(:disabled) {
        background: var(--bg-hover);
      }
      button.btn.primary {
        flex: 1;
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg);
      }
      button.btn.primary:hover:not(:disabled) {
        filter: brightness(0.94);
        background: var(--accent);
      }
      button.btn.primary:disabled {
        cursor: default;
      }
      button.btn.primary:disabled:not(.working) {
        opacity: 0.4;
      }
      /* While working the primary button doubles as the progress track:
         the dim pressed-brand sits under a brighter accent fill. */
      button.btn.primary.working {
        background: var(--accent-pressed);
      }
      button.btn.primary.danger {
        background: var(--danger-bg);
        border-color: var(--danger-bg);
        color: var(--danger-fg);
      }
      button.btn.primary.danger:hover:not(:disabled) {
        background: var(--danger-bg);
        filter: brightness(0.94);
      }
      button.btn[hidden] {
        display: none;
      }
      .btn-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 0%;
        background: var(--accent);
        opacity: 0;
        transition:
          width 200ms ease,
          opacity 120ms ease;
        pointer-events: none;
      }
      button.btn.primary.working .btn-fill {
        opacity: 1;
      }
      /* Determinate fill keeps a moving shimmer so activity reads as live
         even when the percent sits still between updates. */
      button.btn.primary.working:not(.indeterminate) .btn-fill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.45),
          transparent
        );
        animation: shimmer 1.1s ease-in-out infinite;
      }
      button.btn.primary.working.indeterminate .btn-fill {
        width: 35%;
        animation: indeterminate 1.1s ease-in-out infinite;
      }
      .btn-label {
        position: relative;
        z-index: 1;
        display: block;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }
      @keyframes indeterminate {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(300%);
        }
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Niram</h1>
        <p class="subtitle">
          shadcn/ui design system generator. Paste a
          <a href="https://ui.shadcn.com/create" target="_blank" rel="noopener"
            >shadcn preset</a
          >
          code to build variables, components, and blocks.
        </p>
      </header>

      <div class="field">
        <input
          id="preset"
          type="text"
          placeholder="b3HGM2E529 or --preset b3HGM2E529"
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <div class="presets-list" id="presets-list"></div>

      <footer>
        <p id="status" class="status" hidden></p>
        <div class="actions">
          <button id="generate" class="btn primary" type="button" disabled>
            <span class="btn-fill"></span>
            <span class="btn-label">Generate</span>
          </button>
          <button id="confirm-cancel" class="btn" type="button" hidden>
            Cancel
          </button>
          <button
            id="confirm-replace"
            class="btn primary danger"
            type="button"
            hidden
          >
            Replace everything
          </button>
        </div>
      </footer>
    </main>
    <!-- INJECT_UI_SCRIPT -->
  </body>
</html>
